baseURL = "https://tuzov.dev/"
summaryLength = 200

# Change the default theme to be use when building the site with Hugo
theme = "justskiv-loveit"

# website title
title = "Николай Тузов - блог"

# language code ["en", "zh-CN", "fr", "pl", ...]
languageCode = "ru"
# language name ["English", "简体中文", "Français", "Polski", ...]
languageName = "Russian"

defaultContentLanguage = "ru"

# Canonical post URLs: /posts/<slug>/ (every post sets an explicit slug)
[permalinks]
  posts = "/posts/:slug/"

# the theme fork uses the new template layout (layouts/_partials,
# _shortcodes, _markup), which Hugo introduced in 0.146
[module]
  [module.hugoVersion]
    min = "0.146.0"


[params]
  # site default theme ["auto", "light", "dark"]
  defaultTheme = "auto"
  # website title for Open Graph and Twitter Cards
  title = "Nikolay Tuzov blog"
  # website description for RSS, SEO, Open Graph and Twitter Cards
  description = "Блог о разработке и технологиях"
  # default date format for single post and footer dates
  dateformat = "02.01.2006"
  # hash algorithm for content-hash + SRI on bundled css/js
  # (production builds only); value is passed straight to Hugo's
  # `fingerprint` function, so it must be an algorithm, not a bool
  fingerprint = "sha256"

  [params.author]
    name = "Nikolay Tuzov"
    email = "tuzov.n@gmail.com"
    link = "https://t.me/ntuzov"

  [params.footer]
    hugo = false

  # title shown when the site is added to an iOS/Android home screen
  # (otherwise falls back to the theme placeholder "My cool site")
  [params.app]
    title = "Tuzov blog"

[params.social]
Telegram = "ntuzov"
youtubeuser = "@nikolay_tuzov"
rss = "/index.xml"
habr = "JustSkiv"

[params.section]
dateFormat = "02.01"

[params.list]
dateFormat = "02.01"

[params.page]
lightgallery = false
[params.page.comment]
enable = true
[params.page.comment.remark42]
enable = true
host="https://remark42.tuzov.dev"
siteId="tuzov-blog"

[params.page.share]
enable = false

[params.home]
[params.home.profile]
title = "Николай Тузов"
subtitle = "Блог о разработке и технологиях"
gravatarEmail = "just.skiv@gmail.com"
typeit = true

[params.search]
enable = true
# type of search engine ["lunr", "algolia", "fuse", "pagefind"]
type = "pagefind"
# max index length of the chunked content
contentLength = 4000
# placeholder of the search bar
placeholder = ""
#  max number of results length
maxResultLength = 10
#  snippet length of the result
snippetLength = 120
#  HTML tag name of the highlight part in results
highlightTag = "em"
#  whether to use the absolute URL based on the baseURL in search index
absoluteURL = false
[params.search.pagefind]
#  bundle path; must match Pagefind's default output dir (public/pagefind/)
basePath = "/pagefind/"
#  faceted filters in the search dropdown — list of data-pagefind-filter
#  names to expose; [] or omit = feature off (single on/off switch).
#  Frozen in the theme but disabled for now (few posts); set
#  ["category", "tag"] to re-enable.
filters = []

[params.page.toc]
enable = true

[params.header]
# desktop header mode ["fixed", "normal", "auto"]
desktopMode = "normal"
# mobile header mode ["fixed", "normal", "auto"]
mobileMode = "auto"
#  Header title config
[params.header.title]
# URL of the LOGO
logo = "/img/logo.png"
# title name
name = "Николай Тузов"
# you can add extra information before the name (HTML format is supported), such as icons
pre = ""
# you can add extra information after the name (HTML format is supported), such as icons
post = ""
#  whether to use typeit animation for title name
typeit = false

[params.analytics]
enable = true
[params.analytics.yandexMetrica]
id = "82930849"

[outputs]
home = ["HTML", "RSS", "JSON"]

# minify generated HTML/CSS/JS in the final build
[minify]
minifyOutput = true

# Markup related configuration in Hugo
[markup]
[markup.goldmark.renderer]
unsafe = true
# Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
[markup.highlight]
# false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
noClasses = false


[languages]

[languages.ru]
weight = 1
title = "Николай Тузов - блог"
languageCode = "ru"
languageName = "Русский"
[[languages.ru.menu.main]]
weight = 1
identifier = "posts"
pre = ""
post = ""
name = "Архив"
url = "/posts/"
title = ""
[[languages.ru.menu.main]]
weight = 2
identifier = "tags"
pre = ""
post = ""
name = "Теги"
url = "/tags/"
title = ""
[[languages.ru.menu.main]]
weight = 3
identifier = "categories"
name = "Категории"
pre = ""
post = ""
url = "/categories/"
title = ""
[[languages.ru.menu.main]]
weight = 4
identifier = "about"
name = "Обо мне"
pre = ""
post = ""
url = "/about/"
title = ""

